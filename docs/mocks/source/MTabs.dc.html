<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NxtRole tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
.j2{--paper:#F4F1EA;--paper-2:#EBE6DB;--card:#FBF9F4;--ink:#18181C;--ink-2:#45443F;--ink-3:#625F57;--rule:#DAD4C6;--blue:#2443E0;--red:#C23E2A;--red-ink:#A8321F;color-scheme:light}
.j2[data-theme="dark"]{--paper:#111214;--paper-2:#18191C;--card:#1B1C20;--ink:#ECE7DC;--ink-2:#BEB9AE;--ink-3:#8E8A80;--rule:#2B2C31;--blue:#8EA2FF;--red:#FF8A73;--red-ink:#FF8A73;color-scheme:dark}
body{margin:0}
.tb{transition:color .15s ease}
.tb:active{transform:scale(.96)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
.j2 .mono[style*="font-size: 10px"],.j2 .mono[style*="font-size: 10.5px"],.j2 .mono[style*="font-size: 11px"]{font-size:12px !important}.j2 .mono[style*="letter-spacing"]{letter-spacing:.05em !important}
.serif{font-family:'Geist',system-ui,sans-serif !important;font-weight:600 !important;letter-spacing:-.025em}.serif em,em.serif,.serif[style*="italic"]{font-style:normal !important}.serif em{font-weight:500;color:var(--ink-2)}h1.serif{letter-spacing:-.035em}.mono{font-family:'Geist Mono',ui-monospace,monospace !important}body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
</style>
</helmet>
<nav class="j2" data-theme="{{theme}}" aria-label="Main" style="width: 100%; height: 84px; box-sizing: border-box; padding: 6px 8px 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--paper-2); border-top: 1px solid var(--rule); font-family: 'Geist', system-ui, sans-serif">
  <sc-for list="{{items}}" as="i" hint-placeholder-count="5">
    <a href="{{i.href}}" class="tb" aria-current="{{i.current}}" style="{{i.style}}">
      <span style="position: relative; display: inline-flex">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg>
        <sc-if value="{{i.hasCount}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -5px; right: -10px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: var(--red); color: var(--paper); font-family: 'Geist Mono', monospace; font-size: 10px; line-height: 16px; text-align: center">{{i.count}}</span></sc-if>
      </span>
      <span style="font-size: 11px; letter-spacing: .01em">{{i.label}}</span>
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","jobs","pipeline","prepare","more"],"default":"today"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  jpRead() { try { var v = window.localStorage.getItem('morrow-theme'); if (v === 'light' || v === 'dark') return v; } catch (e) {} return 'light'; }
  jpInit() {
    if (this._jpOn) return;
    var self = this;
    this._jpT = this.jpRead();
    this._jpOn = function () { var t = self.jpRead(); if (t !== self._jpT) { self._jpT = t; self.forceUpdate(); } };
    try { window.addEventListener('storage', this._jpOn); window.addEventListener('jp2-theme', this._jpOn); } catch (e) {}
  }
  renderVals() {
    this.jpInit();
    var active = this.props.active ?? 'today';
    var IT = [
      ['today', 'Today', 'MToday.dc.html', 'M4 5h13v14H6a2 2 0 0 1-2-2zM17 8h3v9a2 2 0 0 1-2 2M8 9h5M8 13h5M8 16h3', '2'],
      ['jobs', 'Jobs', 'MJobs.dc.html', 'M5 11a6 6 0 1 0 12 0a6 6 0 1 0-12 0M20 20l-4.3-4.3', ''],
      ['pipeline', 'Pipeline', 'MPipeline.dc.html', 'M3 4h5v16H3zM10 4h5v11h-5zM17 4h4v7h-4z', ''],
      ['prepare', 'Prepare', 'MPrepare.dc.html', 'M4 12a8 8 0 1 0 16 0a8 8 0 1 0-16 0M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0', '1'],
      ['more', 'More', 'MMore.dc.html', 'M4 12a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0M10.5 12a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0M17 12a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0', '3']
    ];
    return {
      theme: this._jpT,
      items: IT.map(function (it) {
        var on = it[0] === active;
        return { label: it[1], href: it[2], icon: it[3], count: it[4], hasCount: !!it[4], current: on ? 'page' : 'false',
          style: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; font-weight: ' + (on ? '700' : '500') + '; color: ' + (on ? 'var(--blue)' : 'var(--ink-3)') };
      })
    };
  }
}
</script>
</body>
</html>
