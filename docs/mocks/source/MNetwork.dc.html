<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Network (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
.j2{--paper:#F4F1EA;--paper-2:#EBE6DB;--card:#FBF9F4;--ink:#18181C;--ink-2:#45443F;--ink-3:#625F57;--rule:#DAD4C6;--rule-2:#C4BCAA;--blue:#2443E0;--blue-ink:#1A33B8;--blue-soft:#E4E8FB;--red:#C23E2A;--red-ink:#A8321F;--red-soft:#F7E3DD;--green:#2F6B3A;--green-soft:#E2EDDF;--amber:#8A5B00;--amber-soft:#F4E9CF;--on-blue:#FFFFFF;color-scheme:light}
.j2[data-theme="dark"]{--paper:#111214;--paper-2:#18191C;--card:#1B1C20;--ink:#ECE7DC;--ink-2:#BEB9AE;--ink-3:#8E8A80;--rule:#2B2C31;--rule-2:#3C3D44;--blue:#8EA2FF;--blue-ink:#B1BEFF;--blue-soft:#1C2342;--red:#FF8A73;--red-ink:#FF8A73;--red-soft:#3A1F19;--green:#8DCB96;--green-soft:#16281A;--amber:#E9C067;--amber-soft:#2F2612;--on-blue:#0D1022;color-scheme:dark}
body{margin:0}
a{color:var(--blue)}a:hover{color:var(--blue-ink)}
button{font-family:inherit;cursor:pointer}
.serif{font-family:'Geist',system-ui,sans-serif;font-weight:600;letter-spacing:-.025em}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
main.scroll > *{flex-shrink:0}
</style>
</helmet>
<div class="j2" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: 'Geist', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
  <main class="scroll" style="flex: 1 1 auto; overflow-y: auto; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; flex-direction: column; gap: 6px">
      <span class="mono" style="font-size: 12px; letter-spacing: .08em; color: var(--ink-3)">NETWORK · 412 CONNECTIONS</span>
      <h1 class="serif" style="margin: 0; font-size: 30px; line-height: 1.1">You know someone at 3 top matches</h1>
      <span style="font-size: 13px; color: var(--ink-3)">From your LinkedIn export, 12 Oct. Emails dropped. Never sent to AI.</span>
    </header>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
        <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="{{p.style}}">
          <span style="flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; background: var(--paper-2)">{{p.ini}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left"><span style="font-weight: 600">{{p.name}}</span><span style="font-size: 13px; color: var(--ink-2)">{{p.title}} · {{p.co}}</span></span>
          <span style="{{p.stStyle}}">{{p.st}}</span>
        </button>
      </sc-for>
    </div>

    <section style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--rule-2)">
      <span class="mono" style="font-size: 11px; letter-spacing: .08em; color: var(--ink-3)">MESSAGE FOR {{selFirst}} · {{selCo}}</span>
      <p style="margin: 0; font-size: 14px; white-space: pre-line">{{msg}}</p>
      <button type="button" onClick="{{ask}}" style="{{askStyle}}">{{askLabel}}</button>
      <a href="https://example.com" style="min-height: 40px; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; text-decoration: none; font-size: 14px">Open LinkedIn profile ↗</a>
    </section>
    <span style="font-size: 12px; color: var(--ink-3)">The AI wrote it with a {name} placeholder; NxtRole added the name itself. You send it.</span>
  </main>
  <div style="flex: 0 0 84px"><dc-import name="MTabs" active="more" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var P = [
  ['riya', 'Riya Kulkarni', 'Senior Frontend Engineer', 'Northwind Labs', 'Frontend Developer'],
  ['dev', 'Dev Shah', 'Engineering Manager', 'Cobalt Commerce', 'Next.js Developer'],
  ['neha', 'Neha Iyer', 'QA Lead', 'Cobalt Commerce', 'Next.js Developer'],
  ['arjun', 'Arjun Rao', 'Product Designer', 'Banyan Health', 'UI Engineer']
];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 'riya', asked: { arjun: true } }; }
  jpRead() { try { var v = window.localStorage.getItem('morrow-theme'); if (v === 'light' || v === 'dark') return v; } catch (e) {} return 'light'; }
  jpInit() { if (this._jpOn) return; var self = this; this._jpT = this.jpRead(); this._jpOn = function () { var t = self.jpRead(); if (t !== self._jpT) { self._jpT = t; self.forceUpdate(); } }; try { window.addEventListener('storage', this._jpOn); window.addEventListener('jp2-theme', this._jpOn); } catch (e) {} }
  renderVals() {
    this.jpInit();
    var self = this, s = this.state;
    var cur = P.filter(function (p) { return p[0] === s.sel; })[0], first = cur[1].split(' ')[0], asked = !!s.asked[cur[0]];
    return {
      theme: this._jpT,
      people: P.map(function (p) { var on = p[0] === s.sel, a = !!s.asked[p[0]];
        return { name: p[1], title: p[2], co: p[3], ini: p[1].split(' ').map(function (w) { return w[0]; }).join(''), pressed: on ? 'true' : 'false', st: a ? 'Asked' : 'Not asked',
          pick: function () { self.setState({ sel: p[0] }); },
          stStyle: 'flex: 0 0 auto; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; ' + (a ? 'background: var(--green-soft); color: var(--green)' : 'border: 1px solid var(--rule-2); color: var(--ink-3)'),
          style: 'display: flex; gap: 12px; align-items: center; width: 100%; min-height: 64px; padding: 10px 12px; border-radius: 12px; color: var(--ink); font-size: 15px; border: 1px solid ' + (on ? 'var(--ink)' : 'var(--rule)') + '; background: ' + (on ? 'var(--card)' : 'transparent') }; }),
      selFirst: first.toUpperCase(), selCo: cur[3].toUpperCase(),
      msg: 'Hi ' + first + ', hope you are well!\n\nI saw ' + cur[3] + ' is hiring a ' + cur[4] + '. I have 3 years of React and TypeScript dashboards, and it looks like a close fit. Would you be open to referring me? Thanks either way!',
      askLabel: asked ? '✓ Marked asked' : 'Copy and mark asked',
      askStyle: 'min-height: 48px; border-radius: 12px; font-weight: 600; font-size: 15px; ' + (asked ? 'border: 1px solid var(--green); background: var(--green-soft); color: var(--green)' : 'border: none; background: var(--blue); color: var(--on-blue)'),
      ask: function () { var x = Object.assign({}, self.state.asked); if (x[cur[0]]) delete x[cur[0]]; else x[cur[0]] = true; self.setState({ asked: x }); }
    };
  }
}
</script>
</body>
</html>
