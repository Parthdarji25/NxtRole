<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NxtRole nav</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
.j2{--paper:#F4F1EA;--paper-2:#EBE6DB;--card:#FBF9F4;--ink:#18181C;--ink-2:#45443F;--ink-3:#625F57;--rule:#DAD4C6;--rule-2:#C4BCAA;--blue:#2443E0;--blue-ink:#1A33B8;--blue-soft:#E4E8FB;--red:#C23E2A;--red-ink:#A8321F;--red-soft:#F7E3DD;--green:#2F6B3A;--green-soft:#E2EDDF;--amber:#8A5B00;--amber-soft:#F4E9CF;--on-blue:#FFFFFF;color-scheme:light}
.j2[data-theme="dark"]{--paper:#111214;--paper-2:#18191C;--card:#1B1C20;--ink:#ECE7DC;--ink-2:#BEB9AE;--ink-3:#8E8A80;--rule:#2B2C31;--rule-2:#3C3D44;--blue:#8EA2FF;--blue-ink:#B1BEFF;--blue-soft:#1C2342;--red:#FF8A73;--red-ink:#FF8A73;--red-soft:#3A1F19;--green:#8DCB96;--green-soft:#16281A;--amber:#E9C067;--amber-soft:#2F2612;--on-blue:#0D1022;color-scheme:dark}
.j2 *{transition-property:background-color,border-color,color;transition-duration:.25s}
body{margin:0}
button{font-family:inherit;cursor:pointer}
.nl{transition:background .15s ease,color .15s ease}
.nl:hover{background:var(--card) !important;color:var(--ink) !important}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.breathe{animation:breathe 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
.j2 .mono[style*="font-size: 10px"],.j2 .mono[style*="font-size: 10.5px"],.j2 .mono[style*="font-size: 11px"]{font-size:12px !important}.j2 .mono[style*="letter-spacing"]{letter-spacing:.05em !important}
.serif{font-family:'Geist',system-ui,sans-serif !important;font-weight:600 !important;letter-spacing:-.025em}.serif em,em.serif,.serif[style*="italic"]{font-style:normal !important}.serif em{font-weight:500;color:var(--ink-2)}h1.serif{letter-spacing:-.035em}.mono{font-family:'Geist Mono',ui-monospace,monospace !important}body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
</style>
</helmet>
<nav class="j2" data-theme="{{theme}}" aria-label="Main" style="width: 100%; min-height: 100%; height: 100vh; box-sizing: border-box; padding: 20px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background: var(--paper-2); color: var(--ink); font-family: 'Geist', system-ui, sans-serif">
  <a href="Landing.dc.html" style="display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 0; text-decoration: none; color: var(--ink)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="color: var(--blue); align-self: center"><path d="M5 7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3zM9 12h6M12.5 9l3 3-3 3"></path></svg><span style="font-family: 'Geist', system-ui, sans-serif; font-size: 23px; font-weight: 700; letter-spacing: -0.03em; line-height: 1">Nxt<span style="color: var(--blue)">Role</span></span>
  </a>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{items}}" as="i" hint-placeholder-count="6">
      <a href="{{i.href}}" class="nl" aria-current="{{i.current}}" style="{{i.style}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg>
        <span style="flex: 1">{{i.label}}</span>
        <sc-if value="{{i.hasCount}}" hint-placeholder-val="{{ false }}"><span style="{{i.countStyle}}">{{i.count}}</span></sc-if>
      </a>
    </sc-for>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <a href="Settings.dc.html" class="nl" aria-current="{{settingsCurrent}}" style="{{settingsStyle}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 7a2 2 0 1 0 4 0a2 2 0 1 0-4 0M8 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0"></path></svg>
      <span>Settings</span>
    </a>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-3)">
      <span class="breathe" style="width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: 0 0 auto"></span>
      <span>Agents idle · next run 2:30 PM</span>
    </div>
    <div role="group" aria-label="Theme" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 8px; border: 1px solid var(--rule)">
      <button type="button" onClick="{{setLight}}" aria-pressed="{{lightPressed}}" style="{{lightStyle}}">Light</button>
      <button type="button" onClick="{{setDark}}" aria-pressed="{{darkPressed}}" style="{{darkStyle}}">Dark</button>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","ask","jobs","pipeline","followups","prepare","studio","resume","network","progress","settings"],"default":"today"},"$preview":{"width":240,"height":960}}'>
class Component extends DCLogic {
  jpRead() { try { var v = window.localStorage.getItem('morrow-theme'); if (v === 'light' || v === 'dark') return v; } catch (e) {} return 'light'; }
  jpInit() {
    if (this._jpOn) return;
    var self = this;
    this._jpT = this.jpRead();
    this._jpOn = function () { var t = self.jpRead(); if (t !== self._jpT) { self._jpT = t; self.forceUpdate(); } };
    try { window.addEventListener('storage', this._jpOn); window.addEventListener('jp2-theme', this._jpOn); } catch (e) {}
  }
  jpSet(n) {
    try { window.localStorage.setItem('morrow-theme', n); } catch (e) {}
    this._jpT = n; this.forceUpdate();
    try { window.dispatchEvent(new Event('jp2-theme')); } catch (e) {}
  }
  renderVals() {
    this.jpInit();
    var self = this;
    var active = this.props.active ?? 'today';
    var dark = this._jpT === 'dark';
    var ITEMS = [
      ['today', 'Today', 'Brief.dc.html', 'M4 5h13v14H6a2 2 0 0 1-2-2zM17 8h3v9a2 2 0 0 1-2 2M8 9h5M8 13h5M8 16h3', '2', true],
      ['ask', 'Ask NxtRole', 'Ask.dc.html', 'M4 5h16v11H9l-5 4zM9 10.5h.01M12 10.5h.01M15 10.5h.01', '', false],
      ['jobs', 'Jobs', 'Jobs.dc.html', 'M5 11a6 6 0 1 0 12 0a6 6 0 1 0-12 0M20 20l-4.3-4.3', '12', false],
      ['pipeline', 'Pipeline', 'Pipeline.dc.html', 'M3 4h5v16H3zM10 4h5v11h-5zM17 4h4v7h-4z', '', false],
      ['followups', 'Follow-ups', 'Nudges.dc.html', 'M12 8v4l2.5 2.5M4 12a8 8 0 1 0 16 0a8 8 0 1 0-16 0', '2', true],
      ['prepare', 'Prepare', 'Prepare.dc.html', 'M4 12a8 8 0 1 0 16 0a8 8 0 1 0-16 0M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0', '1', false],
      ['studio', 'Studio', 'Studio.dc.html', 'M4 20h4L19 9l-4-4L4 16zM13 7l4 4', '3', false],
      ['resume', 'Resume', 'ResumeBuilder.dc.html', 'M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7', '', false],
      ['network', 'Network', 'Network.dc.html', 'M8 9a3 3 0 1 0 0-6a3 3 0 1 0 0 6M2 20a6 6 0 0 1 12 0M17 11a2.5 2.5 0 1 0 0-5a2.5 2.5 0 1 0 0 5M15.5 14.2A5 5 0 0 1 22 19', '3', false],
      ['progress', 'Progress', 'Progress.dc.html', 'M4 20V10M10 20V4M16 20v-7M2 20h20', '', false]
    ];
    var base = 'display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 15px; ';
    var seg = function (on) { return 'min-height: 30px; border-radius: 6px; border: none; font-size: 12px; font-weight: 600; background: ' + (on ? 'var(--card)' : 'transparent') + '; color: ' + (on ? 'var(--ink)' : 'var(--ink-3)') + (on ? '; box-shadow: 0 1px 2px rgba(0,0,0,.08)' : ''); };
    return {
      theme: this._jpT,
      items: ITEMS.map(function (it) {
        var on = it[0] === active;
        return { label: it[1], href: it[2], icon: it[3], count: it[4], hasCount: !!it[4], current: on ? 'page' : 'false',
          countStyle: 'font-family: Geist Mono, ui-monospace, monospace; font-size: 11px; padding: 0 7px; line-height: 18px; border-radius: 999px; ' + (it[5] ? 'background: var(--red); color: var(--paper)' : 'color: var(--ink-3)'),
          style: base + 'font-weight: ' + (on ? '600' : '500') + '; background: ' + (on ? 'var(--card)' : 'transparent') + '; color: ' + (on ? 'var(--ink)' : 'var(--ink-2)') + (on ? '; box-shadow: inset 2px 0 0 var(--blue)' : '') };
      }),
      settingsCurrent: active === 'settings' ? 'page' : 'false',
      settingsStyle: base + 'font-weight: 500; background: ' + (active === 'settings' ? 'var(--card)' : 'transparent') + '; color: ' + (active === 'settings' ? 'var(--ink)' : 'var(--ink-2)'),
      setLight: function () { self.jpSet('light'); }, setDark: function () { self.jpSet('dark'); },
      lightPressed: dark ? 'false' : 'true', darkPressed: dark ? 'true' : 'false',
      lightStyle: seg(!dark), darkStyle: seg(dark)
    };
  }
}
</script>
</body>
</html>
