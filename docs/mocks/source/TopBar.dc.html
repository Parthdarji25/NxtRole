<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NxtRole top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
.j2{--paper:#F4F1EA;--paper-2:#EBE6DB;--card:#FBF9F4;--ink:#18181C;--ink-2:#45443F;--ink-3:#625F57;--rule:#DAD4C6;--rule-2:#C4BCAA;--blue:#2443E0;--blue-ink:#1A33B8;--blue-soft:#E4E8FB;--red:#C23E2A;--red-ink:#A8321F;--red-soft:#F7E3DD;--green:#2F6B3A;--green-soft:#E2EDDF;--amber:#8A5B00;--amber-soft:#F4E9CF;--on-blue:#FFFFFF;--scrim:rgba(24,24,28,.22);--shadow:0 24px 60px -20px rgba(24,24,28,.35);color-scheme:light}
.j2[data-theme="dark"]{--paper:#111214;--paper-2:#18191C;--card:#1B1C20;--ink:#ECE7DC;--ink-2:#BEB9AE;--ink-3:#8E8A80;--rule:#2B2C31;--rule-2:#3C3D44;--blue:#8EA2FF;--blue-ink:#B1BEFF;--blue-soft:#1C2342;--red:#FF8A73;--red-ink:#FF8A73;--red-soft:#3A1F19;--green:#8DCB96;--green-soft:#16281A;--amber:#E9C067;--amber-soft:#2F2612;--on-blue:#0D1022;--scrim:rgba(0,0,0,.5);--shadow:0 24px 60px -20px rgba(0,0,0,.8);color-scheme:dark}
.j2 *{transition-property:background-color,border-color,color;transition-duration:.25s}
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:var(--blue)}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.slide{animation:slide .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade .25s ease both}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.breathe{animation:breathe 2.4s ease-in-out infinite}
.knob{transition:transform .25s ease}
.inp:focus{outline:2px solid var(--blue);outline-offset:1px}
.hit:hover{background:var(--card)}
input{font-family:inherit}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
.j2 .mono[style*="font-size: 10px"],.j2 .mono[style*="font-size: 10.5px"],.j2 .mono[style*="font-size: 11px"]{font-size:12px !important}.j2 .mono[style*="letter-spacing"]{letter-spacing:.05em !important}
.serif{font-family:'Geist',system-ui,sans-serif !important;font-weight:600 !important;letter-spacing:-.025em}.serif em,em.serif,.serif[style*="italic"]{font-style:normal !important}.serif em{font-weight:500;color:var(--ink-2)}h1.serif{letter-spacing:-.035em}.mono{font-family:'Geist Mono',ui-monospace,monospace !important}body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
</style>
</helmet>
<div class="j2" data-theme="{{theme}}" style="font-family: 'Geist', system-ui, sans-serif; color: var(--ink)">
  <div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 28px; border-bottom: 1px solid var(--rule); background: var(--paper)">
    <button type="button" onClick="{{openSearch}}" aria-haspopup="dialog" style="flex: 0 1 380px; min-width: 0; height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card); color: var(--ink-3); font-size: 14px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 11a6 6 0 1 0 12 0a6 6 0 1 0-12 0M20 20l-4.3-4.3"></path></svg>
      <span style="flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">Search jobs, companies, notes, questions…</span>
      <span style="font-family: 'Geist Mono', monospace; font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--rule-2)">Ctrl K</span>
    </button>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 10px">
      <a href="Ask.dc.html" style="height: 38px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--rule); background: transparent; color: var(--ink-2); font-size: 14px; text-decoration: none; box-sizing: border-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4zM9 10.5h.01M12 10.5h.01M15 10.5h.01"></path></svg>
        Ask NxtRole
      </a>
      <button type="button" onClick="{{openLog}}" aria-expanded="{{logExpanded}}" style="height: 38px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--rule); background: transparent; color: var(--ink-2); font-size: 14px">
        <span class="breathe" style="width: 7px; height: 7px; border-radius: 50%; background: var(--green)"></span>
        Agent log
        <span style="font-family: 'Geist Mono', monospace; font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--blue-soft); color: var(--blue)">{{unread}}</span>
      </button>
      <span aria-label="Signed in as Aarav" style="width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 600">AM</span>
    </div>
  </div>

  <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{closeLog}}" aria-label="Close agent log" class="fade" style="position: fixed; inset: 0; z-index: 40; border: none; padding: 0; background: var(--scrim); cursor: default"></button>
    <aside class="slide" role="dialog" aria-modal="true" aria-label="Agent log" style="position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); box-sizing: border-box; background: var(--paper); border-left: 1px solid var(--rule); box-shadow: var(--shadow); padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: 'Geist', system-ui, sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1">Agent log</span>
          <span style="font-size: 13px; color: var(--ink-3)">What ran while you were away. Everything can be undone.</span>
        </div>
        <button type="button" onClick="{{closeLog}}" aria-label="Close" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--rule); background: transparent; color: var(--ink-2); font-size: 16px">✕</button>
      </div>

      <div style="display: flex; flex-direction: column">
        <sc-for list="{{agents}}" as="a" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule)">
            <span style="{{a.dot}}"></span>
            <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 14px">{{a.name}}</span><span style="font-size: 12px; color: var(--ink-3)">{{a.status}}</span></span>
            <button type="button" role="switch" aria-checked="{{a.checked}}" aria-label="{{a.toggleLabel}}" onClick="{{a.toggle}}" style="{{a.track}}"><span class="knob" style="{{a.knob}}"></span></button>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; flex-direction: column; gap: 0">
        <span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .1em; color: var(--ink-3); padding-bottom: 8px">TODAY</span>
        <sc-for list="{{events}}" as="e" hint-placeholder-count="5">
          <div style="display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--rule); opacity: {{e.opacity}}">
            <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--ink-3); min-width: 42px; padding-top: 1px">{{e.time}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 14px">{{e.text}}</span>
              <span style="display: flex; gap: 12px; font-size: 13px">
                <a href="{{e.href}}" style="text-decoration: none; font-weight: 600">{{e.link}}</a>
                <sc-if value="{{e.canUndo}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{e.undo}}" style="background: none; border: none; padding: 0; color: var(--ink-3); font-size: 13px; text-decoration: underline">{{e.undoLabel}}</button></sc-if>
              </span>
            </span>
          </div>
        </sc-for>
      </div>
    </aside>
  </sc-if>
  <sc-if value="{{searchOpen}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{closeSearch}}" aria-label="Close search" class="fade" style="position: fixed; inset: 0; z-index: 50; border: none; padding: 0; background: var(--scrim); cursor: default"></button>
    <div class="fade" role="dialog" aria-modal="true" aria-label="Search" style="position: fixed; z-index: 51; top: 10vh; left: 50%; transform: translateX(-50%); width: min(640px, 92vw); max-height: 76vh; border-radius: 16px; border: 1px solid var(--rule); box-sizing: border-box; background: var(--paper); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; color: var(--ink); font-family: 'Geist', system-ui, sans-serif">
      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--rule)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="color: var(--ink-3); flex: 0 0 auto"><path d="M5 11a6 6 0 1 0 12 0a6 6 0 1 0-12 0M20 20l-4.3-4.3"></path></svg>
        <label for="morrow-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</label>
        <input id="morrow-q" class="inp" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Search jobs, companies, notes, questions" style="flex: 1 1 auto; min-width: 0; height: 44px; padding: 0 8px; border: none; border-radius: 8px; background: transparent; color: var(--ink); font-size: 17px">
        <button type="button" onClick="{{closeSearch}}" style="flex: 0 0 auto; min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--rule-2); background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 600">Close</button>
      </div>
      <div style="flex: 1 1 auto; overflow-y: auto; padding: 8px 8px 14px; display: flex; flex-direction: column">
        <span class="mono" style="font-size: 11px; letter-spacing: .08em; color: var(--ink-3); padding: 8px 10px">{{sLabel}}</span>
        <sc-for list="{{sHits}}" as="h" hint-placeholder-count="4">
          <a href="{{h.href}}" class="hit" style="display: flex; gap: 12px; align-items: flex-start; min-height: 44px; padding: 10px; border-radius: 10px; text-decoration: none; color: var(--ink)">
            <span class="mono" style="flex: 0 0 70px; font-size: 10px; letter-spacing: .06em; color: var(--ink-3); padding-top: 4px">{{h.type}}</span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600">{{h.title}}</span><span style="font-size: 13px; color: var(--ink-2)">{{h.sub}}</span></span>
            <span style="flex: 0 0 auto; font-size: 12px; color: var(--ink-3); padding-top: 3px">{{h.where}}</span>
          </a>
        </sc-for>
        <sc-if value="{{sNone}}" hint-placeholder-val="{{ false }}"><span style="padding: 12px 10px; color: var(--ink-3); font-size: 14px">Nothing found. Try a company, a skill or a word from a note.</span></sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":640}}'>
class Component extends DCLogic {
  jpRead() { try { var v = window.localStorage.getItem('morrow-theme'); if (v === 'light' || v === 'dark') return v; } catch (e) {} return 'light'; }
  jpInit() {
    if (this._jpOn) return;
    var self = this;
    this._jpT = this.jpRead();
    this._jpOn = function () { var t = self.jpRead(); if (t !== self._jpT) { self._jpT = t; self.forceUpdate(); } };
    try { window.addEventListener('storage', this._jpOn); window.addEventListener('jp2-theme', this._jpOn); } catch (e) {}
  }
  constructor(props) { super(props); this.state = { open: false, seen: false, off: {}, undone: {}, sOpen: false, q: '' }; }
  renderVals() {
    this.jpInit();
    var self = this, s = this.state;
    var AG = [['discovery', 'Job discovery', 'Ran 2:00 AM · 163 read · 9 matched', 'var(--green)'], ['inbox', 'Inbox', '2 emails moved cards · 7:12 AM', 'var(--green)'], ['radar', 'Company radar', '1 new hiring signal', 'var(--green)'], ['research', 'Interview research', 'Kestrel Pay brief ready', 'var(--blue)'], ['safety', 'Safety filter', '2 suspicious posts hidden', 'var(--amber)']];
    var EV = [
      ['e1', '07:12', 'Moved Kestrel Pay to Interview: invite found in Gmail.', 'Open pipeline', 'Pipeline.dc.html', true],
      ['e2', '07:12', 'Added round 2 to Google Calendar, Wed 3:00 PM IST.', 'View', 'Prepare.dc.html', true],
      ['e3', '06:40', 'Built a research brief for Kestrel Pay from 23 sources.', 'Open brief', 'Prepare.dc.html', false],
      ['e4', '02:00', 'Found 9 new matches above 80%. 2 posted under an hour ago.', 'See jobs', 'Jobs.dc.html', false],
      ['e5', '02:00', 'Hid 2 postings asking for a registration fee.', 'Review', 'Settings.dc.html', true]
    ];
    var MOB = false;
    var SX = [
      ['Job', 'Frontend Developer · Northwind Labs', 'Mumbai, hybrid · 92% match · closes Thu 22 Oct', 'Jobs', 'react next.js typescript dashboard'],
      ['Job', 'React Engineer · Kestrel Pay', 'Remote · interview round 2 Wed 21 Oct', 'Jobs', 'payments checkout'],
      ['Job', 'Next.js Developer · Cobalt Commerce', 'Remote · 84% match', 'Jobs', 'storefront prisma'],
      ['Company', 'Tealbrook Analytics', 'Round 2 Wed 28 Oct, 9:30 PM IST · frontend system design', 'Pipeline', 'dashboard new york'],
      ['Company', 'Vellum Health', 'Offer ₹22 L year one · reply by Fri 30 Oct', 'Pipeline', 'offer hybrid pune'],
      ['Company', 'Orchid Pay', 'Offer ₹21 L · reply by Tue 27 Oct', 'Pipeline', 'offer remote'],
      ['Note', 'Kestrel Pay: ask about on-call for checkout', 'Pipeline note · Kabir Menon referred me', 'Pipeline', 'kestrel referral'],
      ['Note', 'Tealbrook: round 2 interviewer wants dashboard design depth', 'Pipeline note', 'Pipeline', 'system design'],
      ['Note', 'Saffron Systems: recruiter moved the HR screen, same panel', 'Pipeline note', 'Pipeline', 'reschedule'],
      ['Question', 'What does this print? setTimeout vs Promise', 'Harbor & Co · round 2 · weak · event loop', 'Progress', 'event loop microtask javascript'],
      ['Question', 'Build an autocomplete that calls an API as you type', 'Monsoon Labs · machine coding · weak', 'Progress', 'debounce abortcontroller combobox'],
      ['Question', 'Tell me about a time you disagreed with a designer', 'Tealbrook · behavioural · weak · STAR', 'Progress', 'star story conflict'],
      ['Question', 'Explain the event loop (likely at Kestrel Pay)', 'Prepare · asked 7 times', 'Prepare', 'event loop javascript'],
      ['Draft', 'Referral ask to Riya Kulkarni', 'Studio · Northwind Labs', 'Studio', 'referral alumni'],
      ['Draft', 'Follow-up to Pinecrest Studio', 'Studio · scheduled for 10:00 AM', 'Studio', 'follow up'],
      ['Story', 'Dashboard rebuild: LCP 4.1 s to 2.3 s', 'Story bank · ownership, performance', 'Progress', 'performance lighthouse star']
    ];
    var sq = (s.q || '').trim().toLowerCase();
    var hits = sq ? SX.filter(function (r) { return (r[1] + ' ' + r[2] + ' ' + r[4] + ' ' + r[0]).toLowerCase().indexOf(sq) >= 0; }) : SX.filter(function (r, i) { return [1, 3, 6, 9].indexOf(i) >= 0; });
    var SRV = {
      searchOpen: !!s.sOpen,
      openSearch: function () { self.setState({ sOpen: true, q: '' }); },
      closeSearch: function () { self.setState({ sOpen: false }); },
      q: s.q || '', onQ: function (e) { self.setState({ q: e.target.value }); },
      sLabel: sq ? hits.length + ' result' + (hits.length === 1 ? '' : 's') + ' for “' + s.q.trim() + '”' : 'RECENT',
      sHits: hits.map(function (r) { return { type: r[0].toUpperCase(), title: r[1], sub: r[2], href: (MOB ? 'M' : '') + (r[3] === 'Today' ? 'Brief' : r[3]) + '.dc.html', where: r[3] }; }),
      sNone: sq && hits.length === 0
    };
    var knob = function (on) { return 'display: block; width: 16px; height: 16px; border-radius: 50%; background: ' + (on ? 'var(--paper)' : 'var(--ink-3)') + '; transform: translateX(' + (on ? '21px' : '0') + ')'; };
    return Object.assign(SRV, {
      theme: this._jpT,
      open: s.open, logExpanded: s.open ? 'true' : 'false',
      unread: s.seen ? '0' : '4',
      openLog: function () { self.setState({ open: true, seen: true }); },
      closeLog: function () { self.setState({ open: false }); },
      agents: AG.map(function (a) { var on = !s.off[a[0]];
        return { name: a[1], status: on ? a[2] : 'Paused', checked: on ? 'true' : 'false', toggleLabel: (on ? 'Pause ' : 'Resume ') + a[1],
          dot: 'flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: ' + (on ? a[3] : 'var(--rule-2)'),
          track: 'flex: 0 0 auto; box-sizing: border-box; width: 44px; height: 24px; border-radius: 999px; padding: 2px; display: flex; border: 1.5px solid ' + (on ? 'var(--ink)' : 'var(--ink-3)') + '; background: ' + (on ? 'var(--ink)' : 'transparent'),
          knob: knob(on),
          toggle: function () { var x = Object.assign({}, self.state.off); x[a[0]] = !x[a[0]]; self.setState({ off: x }); } }; }),
      events: EV.map(function (e) { var u = !!s.undone[e[0]];
        return { time: e[1], text: u ? 'Undone: ' + e[2] : e[2], link: e[3], href: e[4], canUndo: e[5], undoLabel: u ? 'Redo' : 'Undo', opacity: u ? '0.5' : '1',
          undo: function () { var x = Object.assign({}, self.state.undone); x[e[0]] = !x[e[0]]; self.setState({ undone: x }); } }; })
    });
  }
}
</script>
</body>
</html>
