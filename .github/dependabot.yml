# GitHub proposes dependency updates as pull requests. You decide whether to merge them.
# cooldown: only releases at least 7 days old are proposed (D-036). Security fixes are not delayed.
version: 2
updates:
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # pnpm projects use the "npm" ecosystem.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
