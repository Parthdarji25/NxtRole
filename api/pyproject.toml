[project]
name = "nxtrole-api"
version = "0.1.0"
description = "NxtRole API and background worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# This is an application, not a library to be installed.
package = false
# D-036: only adopt releases that are at least 7 days old.
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers -ra"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, modern syntax, likely bugs, async mistakes, security, simplifications
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, and fake passwords that protect nothing.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
