# pnpm settings for the web app.
# D-036 / D-042: only install releases that are at least 7 days (10080 minutes) old.
minimumReleaseAge: 10080
# Fail instead of quietly picking a newer release when nothing old enough matches.
minimumReleaseAgeStrict: true
# Exact versions in package.json, so an upgrade is always a visible change.
saveExact: true
